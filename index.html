<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Analog Books</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse two million Goodreads books with Analog SSR, server-rendered search, and URL-driven filters.">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta property="og:description" content="Browse two million Goodreads books with Analog SSR, server-rendered search, and URL-driven filters.">
  <meta property="og:site_name" content="Analog Books">
  <meta property="og:title" content="Analog Books">
  <meta property="og:type" content="website">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script>(function(){try{var t=localStorage.getItem("theme");var d=t==="dark"||((t==="system"||!t)&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",d);}catch(e){}})();</script>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body class="bg-surface text-black antialiased dark:bg-surface-dark dark:text-white">
  <app-root></app-root>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
